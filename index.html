<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANZHOLOV Mini App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f0f11;
            color: #ffffff;
            padding: 12px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            margin-bottom: 12px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }
        .header-sub {
            font-size: 11px;
            color: #8e8e93;
            text-align: center;
        }
        .status-card {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .status-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-desc {
            font-size: 13px;
            color: #aeaeb2;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .status-footer {
            font-size: 13px;
            color: #d1d1d6;
            border-top: 1px solid #2c2c2e;
            padding-top: 10px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tab {
            background: #1c1c1e;
            color: #8e8e93;
            border: none;
            padding: 8px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        .tab.active {
            background: #0a84ff;
            color: #ffffff;
        }
        .content-card {
            background: #1c1c1e;
            border-radius: 24px;
            padding: 16px;
            flex-grow: 1;
            margin-bottom: 60px;
        }
        .date-title {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 14px;
        }
        .lesson-item {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .lesson-badge {
            width: 34px;
            height: 34px;
            background: #0a84ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .lesson-info {
            flex-grow: 1;
        }
        .lesson-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .lesson-time {
            font-size: 12px;
            color: #8e8e93;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #161618;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #2c2c2e;
            max-width: 480px;
            margin: 0 auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8e8e93;
            font-size: 10px;
            text-decoration: none;
            gap: 4px;
        }
        .nav-item.active {
            color: #0a84ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="color: #0a84ff; font-size: 15px;">Закрыть</div>
        <div>
            <div class="header-title" style="font-weight:700;">AMANZHOLOVbot</div>
            <div class="header-sub">мини-приложение</div>
        </div>
        <div style="font-size: 18px; font-weight: bold;">•••</div>
    </div>

    <div class="status-card">
        <div class="status-title">☕ Перемена</div>
        <div class="status-desc">Далее: Физическая культура<br>Начало в 07:30</div>
        <div class="status-footer">
            ⏳ До начала пары осталось 35 мин
        </div>
    </div>

    <div class="tabs">
        <button class="tab active">📅 Сегодня</button>
        <button class="tab">📅 Завтра</button>
        <button class="tab">🔔 Звонки</button>
    </div>

    <div class="content-card">
        <div class="date-title">Сегодня, понедельник</div>
        
        <div class="lesson-item">
            <div class="lesson-badge">1</div>
            <div class="lesson-info">
                <div class="lesson-name">Социология (Лекция)</div>
                <div class="lesson-time">09:50–10:40</div>
            </div>
        </div>

        <div class="lesson-item">
            <div class="lesson-badge" style="background: #30b0c7;">2</div>
            <div class="lesson-info">
                <div class="lesson-name">Иностранный язык (СПЗ)</div>
                <div class="lesson-time">11:00–11:50</div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item active">🏠 Главная</a>
        <a href="#" class="nav-item">📝 ДЗ</a>
        <a href="#" class="nav-item">⏰ Напоминания</a>
        <a href="#" class="nav-item">🧩 Ещё</a>
    </div>
</body>
</html>
